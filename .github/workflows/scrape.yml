name: scrape
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      brands:
        description: "Comma-separated brands, or 'all'"
        default: "samsung,apple,google,xiaomi,oneplus,motorola,nothing"
      max_per_brand:
        description: "Max phones to scrape per brand"
        default: "20"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: |
          python scraper/scrape_gsmarena.py \
            --brands "${{ github.event.inputs.brands || 'samsung,apple,google,xiaomi,oneplus,motorola,nothing' }}" \
            --max-per-brand "${{ github.event.inputs.max_per_brand || '20' }}" \
            --output data/phones.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/phones.json
          git diff --cached --quiet || git commit -m "chore: refresh scraped phone data"
          git push
